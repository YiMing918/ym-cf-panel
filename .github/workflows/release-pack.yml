name: 部署包自动刷新

# 发版（Release 发布）时，自动按下面的清单从该标签的代码重打「手机部署包」，
# 并刷新到这个 Release（同名覆盖、旧日期的包会删掉，只留最新一个）。
# 也可以在 Actions 页手动运行：填一个已经存在的 Release 标签，给它补包/刷新包。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 Release 标签（如 v1.0.0）"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-pack
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: 确定标签与包名
        id: t
        env:
          REL_TAG: ${{ github.event.release.tag_name }}
          IN_TAG: ${{ inputs.tag }}
        run: |
          TAG="${REL_TAG:-$IN_TAG}"
          if [ -z "$TAG" ]; then echo "::error::没有拿到 Release 标签"; exit 1; fi
          ZIPNAME="ym-cf-panel-deploy-$(TZ=Asia/Shanghai date +%Y%m%d).zip"
          WZIPNAME="ym-cf-panel-worker-deploy-$(TZ=Asia/Shanghai date +%Y%m%d).zip"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIPNAME" >> "$GITHUB_OUTPUT"
          echo "wzip=$WZIPNAME" >> "$GITHUB_OUTPUT"
          echo "本次处理：$TAG -> $ZIPNAME"

      - name: 拉取该标签的代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.t.outputs.tag }}

      - name: 准备 Node（装锁定版工具与跑测试用）
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: 装锁定版工具（npm ci 按 package-lock.json）
        run: npm ci

      - name: 跑仓库测试（不过不打包）
        run: |
          for f in tests/*.mjs; do node "$f" || exit 1; done

      - name: 按清单打包
        env:
          ZIPNAME: ${{ steps.t.outputs.zip }}
        run: |
          set -euo pipefail
          rm -rf stage && mkdir stage
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if [ ! -f "$f" ]; then echo "::error::清单里的文件不存在：$f"; exit 1; fi
            mkdir -p "stage/$(dirname "$f")"
            cp "$f" "stage/$f"
          done <<'PACKLIST'
          _headers
          functions/_auth.js
          functions/_cf.js
          functions/_manage.js
          functions/_secrets.js
          functions/_store.js
          functions/api/access.js
          functions/api/accountadmin.js
          functions/api/accounts.js
          functions/api/accttokens.js
          functions/api/audit.js
          functions/api/certs.js
          functions/api/d1admin.js
          functions/api/d1sql.js
          functions/api/dns.js
          functions/api/dnsio.js
          functions/api/domains.js
          functions/api/emailroute.js
          functions/api/health.js
          functions/api/images.js
          functions/api/kvdata.js
          functions/api/kvio.js
          functions/api/kvns.js
          functions/api/loadbalancers.js
          functions/api/login.js
          functions/api/logout.js
          functions/api/pagesadmin.js
          functions/api/pagesops.js
          functions/api/public.js
          functions/api/purge.js
          functions/api/queues.js
          functions/api/r2admin.js
          functions/api/r2objects.js
          functions/api/registrar.js
          functions/api/rules.js
          functions/api/settings.js
          functions/api/setup.js
          functions/api/state.js
          functions/api/stream.js
          functions/api/tunnels.js
          functions/api/usage.js
          functions/api/workerscode.js
          functions/api/workersinfo.js
          functions/api/workersops.js
          functions/api/workerstail.js
          functions/api/zoneset.js
          index.html
          wrangler.toml.example
          PACKLIST
          find stage -type f -exec touch -d '1980-01-01 00:00:00' {} +
          cd stage
          find . -type f | sed 's|^\./||' | LC_ALL=C sort | zip -q -X -D "../$ZIPNAME" -@
          cd ..
          sha256sum "$ZIPNAME" > SHA256SUMS.txt
          echo "包内文件："
          unzip -Z1 "$ZIPNAME"
          cat SHA256SUMS.txt


      - name: 打包直传专用包（_worker.js 高级模式）
        # 控制台拖拽上传不会编译 functions/，所以另产一个包：把 functions/ 的
        # 原处理函数用 build/worker-entry.js 合成单个 _worker.js（原源码不改），
        # 与全部静态文件同放根目录。方式二（手机部署包直接上传）专用。
        env:
          WZIPNAME: ${{ steps.t.outputs.wzip }}
        run: |
          set -euo pipefail
          ./node_modules/.bin/esbuild build/worker-entry.js --bundle --format=esm --platform=neutral --target=es2022 --outfile=_worker.js
          rm -rf wstage && mkdir wstage
          cp _worker.js wstage/
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if [ ! -f "$f" ]; then echo "::error::静态清单里的文件不存在：$f"; exit 1; fi
            mkdir -p "wstage/$(dirname "$f")"
            cp "$f" "wstage/$f"
          done <<'STATICLIST'
          _headers
          index.html
          wrangler.toml.example
          STATICLIST
          find wstage -type f -exec touch -d '1980-01-01 00:00:00' {} +
          cd wstage
          find . -type f | sed 's|^\./||' | LC_ALL=C sort | zip -q -X -D "../$WZIPNAME" -@
          cd ..
          sha256sum "$WZIPNAME" >> SHA256SUMS.txt
          echo "直传包内文件："
          unzip -Z1 "$WZIPNAME"
          cat SHA256SUMS.txt

      - name: 刷新到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.t.outputs.tag }}
          ZIPNAME: ${{ steps.t.outputs.zip }}
          WZIPNAME: ${{ steps.t.outputs.wzip }}
        run: |
          set -euo pipefail
          gh release view "$TAG" > /dev/null
          gh release delete-asset "$TAG" "SHA256SUMS.txt" -y || true
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -E '^ym-cf-panel-deploy-[0-9]{8}\.zip$' | grep -vx "$ZIPNAME" | while read -r a; do echo "删除旧包：$a"; gh release delete-asset "$TAG" "$a" -y; done || true
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -E '^ym-cf-panel-worker-deploy-[0-9]{8}\.zip$' | grep -vx "$WZIPNAME" | while read -r a; do echo "删除旧直传包：$a"; gh release delete-asset "$TAG" "$a" -y; done || true
          gh release upload "$TAG" "$ZIPNAME" "$WZIPNAME" SHA256SUMS.txt --clobber
          echo "已刷新到 Release $TAG：$ZIPNAME + $WZIPNAME + SHA256SUMS.txt"
